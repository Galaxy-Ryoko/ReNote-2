name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet publish "Renote 2/Renote 2.csproj" -c Release -p:Platform=${{ matrix.platform }} --self-contained -f net8.0-windows10.0.19041.0

      - name: Create distribution package
        shell: powershell
        run: |
          $publishDir = "Renote 2/bin/Release/net8.0-windows10.0.19041.0/win-${{ matrix.platform }}/publish"
          $packageDir = "dist/ReNote2-${{ matrix.platform }}-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -Path "$publishDir/*" -Destination $packageDir -Recurse -Force
          Compress-Archive -Path $packageDir -DestinationPath "dist/ReNote2-${{ matrix.platform }}-${{ github.ref_name }}.zip" -Force

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ReNote2-${{ matrix.platform }}-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        if: '!startsWith(github.ref, ''refs/tags/'')'
        uses: actions/upload-artifact@v4
        with:
          name: ReNote2-${{ matrix.platform }}
          path: dist/ReNote2-${{ matrix.platform }}-*
